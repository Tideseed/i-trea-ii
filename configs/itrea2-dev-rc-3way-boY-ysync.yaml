# I-TREA II -- R1 of the C1 diagnosis (vault 30-results/2026-10-14 C1 diagnosis and improvement candidates.md), variant
# `boY-ysync`: R1's pre-stated fallback (b) of D-025, for the case where bsync's generation guard on item_placement_9903
# or comp21-2idx fails (wake latency): CU_CTX_SCHED_YIELD instead of blocking sync (`host.cuda_sched: yield`): the host
# keeps polling the GPU but yields its time slice at each poll; the timing events are created as before.
#
# Base = configs/itrea2-dev-rc-3way-boY.yaml verbatim (D-023's phase Y only, 5c8b535fb245: the A9 development default if
# D-023 adopts it), plus that one change; `exchange.from_cuopt` is added by the runner for A9. The test (`itrea
# make-jobs r1-bsync --control boY --variant ysync`, set `r1-ysync`, D-025) runs it against A9@boY's configuration, the
# same-day development default re-run under the label A9@r1ctl. Development only (D-010); it becomes a default only by a
# decision on a verdict.
name: itrea2-dev-rc-3way-boY-ysync
strategy:
  enabled: true
seeding:
  lp_source: highs_async
lp_stream:
  enabled: true
repair:
  max_steps: 20000
  stall_steps: 1000
repair_clock:
  enabled: true
  mode: active
backoff:
  enabled: true
  mode: active
  yield_level: 1
  levels: 3
  yield_until_s: 30.0
  patience_search_s: 100000.0
  patience_own_s: 100000.0
  patience_min_s: 100000.0
  patience_max_s: 100000.0
host:
  cuda_sched: yield
