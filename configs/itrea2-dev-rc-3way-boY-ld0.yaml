# I-TREA II -- R2 of the C1 diagnosis (vault 30-results/2026-10-14 C1 diagnosis and improvement candidates.md), variant
# `boY-ld0`: R2's pre-written fallback if R1 is not adopted: the LP decode inside A9, still gated after the EA's HiGHS
# LP worker (`repair.lp_decode_gate: lp_worker`), at nice 0 beside the spinning host (`repair.lp_decode_nice: 0`); no
# blocking sync.
#
# Base = configs/itrea2-dev-rc-3way-boY.yaml verbatim (D-023's phase Y only, 5c8b535fb245: the A9 development default if
# D-023 adopts it), plus the decode; the runner accepts lp_decode in A9 only with this gate (pair.py), and the warm-up
# compiles the >8-part concatenate a decoded batch can bring. `exchange.from_cuopt` is added by the runner for A9. The
# test (`itrea make-jobs r2-ld --base boY`, set `r2-ld`, D-026) runs it as A9@r2ld against A9@boY's configuration re-run
# as A9@r2ctl. Development only (D-010); it becomes a default only by a decision on a verdict.
name: itrea2-dev-rc-3way-boY-ld0
strategy:
  enabled: true
seeding:
  lp_source: highs_async
lp_stream:
  enabled: true
repair:
  max_steps: 20000
  stall_steps: 1000
  continuous: lp_decode
  lp_decode_gate: lp_worker
  lp_decode_nice: 0
repair_clock:
  enabled: true
  mode: active
backoff:
  enabled: true
  mode: active
  yield_level: 1
  levels: 3
  yield_until_s: 30.0
  patience_search_s: 100000.0
  patience_own_s: 100000.0
  patience_min_s: 100000.0
  patience_max_s: 100000.0
