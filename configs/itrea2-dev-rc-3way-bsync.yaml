# I-TREA II -- R1 of the C1 diagnosis (vault 30-results/2026-10-14 C1 diagnosis and improvement candidates.md), variant
# `bsync`: the EA's primary CUDA context waits by blocking sync (`host.cuda_sched: blocking_sync`:
# CU_CTX_SCHED_BLOCKING_SYNC set through the driver API before anything retains the context, the per-generation timing
# events blocking too), so the host sleeps during its GPU waits and the HiGHS LP worker it spawns at t0 gets the X925
# core they share in A9.
#
# Base = configs/itrea2-dev-rc-3way.yaml verbatim (the A9 development default, 1d12ad490dd0), plus that one change;
# `exchange.from_cuopt` is added by the runner for A9. The test (`itrea make-jobs r1-bsync --control r13x`, set
# `r1-bsync`, D-025) runs it against A9@r13x's configuration, the same-day development default re-run under the label
# A9@r1ctl. Development only (D-010); it becomes a default only by a decision on a verdict.
name: itrea2-dev-rc-3way-bsync
strategy:
  enabled: true
seeding:
  lp_source: highs_async
lp_stream:
  enabled: true
repair:
  max_steps: 20000
  stall_steps: 1000
repair_clock:
  enabled: true
  mode: active
host:
  cuda_sched: blocking_sync
