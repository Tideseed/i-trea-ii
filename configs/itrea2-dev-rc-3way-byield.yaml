# I-TREA II -- R1 of the C1 diagnosis (vault 30-results/2026-10-14 C1 diagnosis and improvement candidates.md),
# variant `byield`: R1's pre-stated fallback (b), for the case where bsync's generation guard on item_placement_9903
# or comp21-2idx fails (wake latency): CU_CTX_SCHED_YIELD instead of blocking sync (`host.cuda_sched: yield`): the
# host keeps polling the GPU but yields its time slice at each poll.
#
# Base = configs/itrea2-dev-rc-3way.yaml verbatim (the A9 development default, 1d12ad490dd0), plus that one change;
# `exchange.from_cuopt` is added by the runner for A9. The test (`itrea make-jobs r1-bsync --control r13x`) runs it
# against A9@r13x, the same-day development default. Development only (D-010); it becomes a default only by a decision
# on a verdict.
name: itrea2-dev-rc-3way-byield
strategy:
  enabled: true
seeding:
  lp_source: highs_async
lp_stream:
  enabled: true
repair:
  max_steps: 20000
  stall_steps: 1000
repair_clock:
  enabled: true
  mode: active
host:
  cuda_sched: yield
