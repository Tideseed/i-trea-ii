# I-TREA II -- R1 of the C1 diagnosis (vault 30-results/2026-10-14 C1 diagnosis and improvement candidates.md),
# variant `bsyncn`: bsync + R1's pre-stated fallback (a), for the case where the EA's self-CPU does not fall under
# bsync (some wait path still spins): right after the LP worker's spawn every thread of the EA host takes nice 10
# (`host.nice_after_lp_spawn: 10`; the worker stays at 0, so with CFS weights 110 : 1024 it gets about 90 % of the
# shared core while both are runnable). The host keeps nice 10 to the end of the run.
#
# Base = configs/itrea2-dev-rc-3way.yaml verbatim (the A9 development default, 1d12ad490dd0), plus that one change;
# `exchange.from_cuopt` is added by the runner for A9. The test (`itrea make-jobs r1-bsync --control r13x`) runs it
# against A9@r13x, the same-day development default. Development only (D-010); it becomes a default only by a decision
# on a verdict.
name: itrea2-dev-rc-3way-bsyncn
strategy:
  enabled: true
seeding:
  lp_source: highs_async
lp_stream:
  enabled: true
repair:
  max_steps: 20000
  stall_steps: 1000
repair_clock:
  enabled: true
  mode: active
host:
  cuda_sched: blocking_sync
  nice_after_lp_spawn: 10
