# I-TREA II -- R1 of the C1 diagnosis (vault 30-results/2026-10-14 C1 diagnosis and improvement candidates.md), variant
# `boY-bnice`: R1's pre-stated fallback (a) of D-025, renice WITHOUT a context flag: right after the LP worker's spawn
# every thread of the EA host takes nice +10 relative to the nice it spawned the worker at (`host.nice_after_lp_spawn:
# 10`; the worker keeps the inherited value, so with CFS weights 110 : 1024 it gets about 90 % of the shared core while
# both are runnable). The context keeps CUDA's default scheduling (the host still spins, at the lower priority). The
# host keeps its nice to the end of the run.
#
# Base = configs/itrea2-dev-rc-3way-boY.yaml verbatim (D-023's phase Y only, 5c8b535fb245: the A9 development default if
# D-023 adopts it), plus that one change; `exchange.from_cuopt` is added by the runner for A9. The test (`itrea
# make-jobs r1-bsync --control boY --variant bnice`, set `r1-bnice`, D-025) runs it against A9@boY's configuration, the
# same-day development default re-run under the label A9@r1ctl. Development only (D-010); it becomes a default only by a
# decision on a verdict.
name: itrea2-dev-rc-3way-boY-bnice
strategy:
  enabled: true
seeding:
  lp_source: highs_async
lp_stream:
  enabled: true
repair:
  max_steps: 20000
  stall_steps: 1000
repair_clock:
  enabled: true
  mode: active
backoff:
  enabled: true
  mode: active
  yield_level: 1
  levels: 3
  yield_until_s: 30.0
  patience_search_s: 100000.0
  patience_own_s: 100000.0
  patience_min_s: 100000.0
  patience_max_s: 100000.0
host:
  nice_after_lp_spawn: 10
