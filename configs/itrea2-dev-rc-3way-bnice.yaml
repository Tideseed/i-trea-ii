# I-TREA II -- R1 of the C1 diagnosis (vault 30-results/2026-10-14 C1 diagnosis and improvement candidates.md), variant
# `bnice`: R1's pre-stated fallback (a) of D-025, renice WITHOUT a context flag: right after the LP worker's spawn every
# thread of the EA host takes nice +10 relative to the nice it spawned the worker at (`host.nice_after_lp_spawn: 10`;
# the worker keeps the inherited value, so with CFS weights 110 : 1024 it gets about 90 % of the shared core while both
# are runnable). The context keeps CUDA's default scheduling (the host still spins, at the lower priority). The host
# keeps its nice to the end of the run.
#
# Base = configs/itrea2-dev-rc-3way.yaml verbatim (the A9 development default, 1d12ad490dd0), plus that one change;
# `exchange.from_cuopt` is added by the runner for A9. The test (`itrea make-jobs r1-bsync --control r13x --variant
# bnice`, set `r1-bnice`, D-025) runs it against A9@r13x's configuration, the same-day development default re-run under
# the label A9@r1ctl. Development only (D-010); it becomes a default only by a decision on a verdict.
name: itrea2-dev-rc-3way-bnice
strategy:
  enabled: true
seeding:
  lp_source: highs_async
lp_stream:
  enabled: true
repair:
  max_steps: 20000
  stall_steps: 1000
repair_clock:
  enabled: true
  mode: active
host:
  nice_after_lp_spawn: 10
